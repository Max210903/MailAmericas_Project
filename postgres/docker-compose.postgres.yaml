# Base de datos de trabajo del proyecto. Es independiente del ambiente de Airflow:
# tiene su propio proyecto de Docker Compose, su propio contenedor y su propio volumen.
name: mailamericas-postgres

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mailamericas
      POSTGRES_PASSWORD: mailamericas
      POSTGRES_DB: mailamericas
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  data:
